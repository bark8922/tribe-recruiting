name: Refresh team_leads.json (BambooHR)

# Pulls the BambooHR org chart, derives the WBR team-lead filter map, and
# commits recruiting-dashboard/src/team_leads.json back to main. Cloudflare
# Pages auto-rebuilds the dashboard when the file changes.
#
# Runs daily because the org chart changes rarely; the Keboola flow keeps
# refreshing dashboard_data_snowflake.json on its own 3x/day cadence and is
# completely independent of this workflow.

on:
  schedule:
    - cron: "30 6 * * *"   # daily at 06:30 UTC (~07:30/08:30 CET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-team-leads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure git identity
        run: |
          git config user.email "blake+team-leads-refresh@tribe.xyz"
          git config user.name "team-leads-refresh-bot"

      - name: Pull Bamboo + rebuild team_leads.json
        env:
          BAMBOOHR_SUBDOMAIN: ${{ secrets.BAMBOOHR_SUBDOMAIN }}
          BAMBOOHR_API_KEY: ${{ secrets.BAMBOOHR_API_KEY }}
          REPO_ROOT: ${{ github.workspace }}
        run: python -m pipeline.refresh_team_leads

      - name: Commit if changed
        run: |
          set -euo pipefail
          git add recruiting-dashboard/src/team_leads.json
          if git diff --cached --quiet; then
            echo "team_leads.json unchanged — no commit"
            exit 0
          fi
          git commit -m "refresh: team_leads.json from BambooHR ($(date -u +%Y-%m-%d))"
          git push
